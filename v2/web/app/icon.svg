<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#2563EB" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect width="32" height="32" rx="8" fill="#060913" />
  <rect width="32" height="32" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Shield Outer Shell -->
  <path
    d="M16 4.5 L25 8 C25 15.5 21 21.5 16 26 C11 21.5 7 15.5 7 8 Z"
    fill="url(#shieldGrad)"
    fill-opacity="0.2"
    stroke="url(#shieldGrad)"
    stroke-width="1.75"
    stroke-linejoin="round"
    filter="url(#shieldGlow)"
  />

  <!-- Shield Inner Crest Checkmark -->
  <path
    d="M12 15 L15 18 L20 12"
    stroke="#38BDF8"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central Sentinel Eye Core Dot -->
  <circle cx="16" cy="8.5" r="1.25" fill="#34D399" />
</svg>
