name: Scam Shield v2 CI Pipeline

on:
  push:
    branches: [ "feat/v2-upgrade", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit-protected-paths:
    name: Audit Protected Legacy Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Non-Destructive Integrity Audit
        run: |
          chmod +x v2/scripts/check_protected.sh
          ./v2/scripts/check_protected.sh

  legacy-regression-tests:
    name: Legacy Agent Pipeline Tests (125 tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run legacy pytest suite
        run: |
          pytest tests/ -q

  v2-backend-tests:
    name: v2 FastAPI & Services Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sse-starlette pydantic-settings slowapi sqlalchemy alembic pytest-asyncio pytest-cov httpx

      - name: Run v2 unit and contract tests with coverage
        run: |
          pytest v2/api/tests/ -v --cov=v2.api.services --cov-report=term-missing

  v2-frontend-build:
    name: v2 Next.js App Router Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "v2/web/package-lock.json"

      - name: Install web dependencies
        working-directory: v2/web
        run: npm ci

      - name: Run frontend unit tests
        working-directory: v2/web
        run: npm test

      - name: Build production Next.js app
        working-directory: v2/web
        run: npm run build
